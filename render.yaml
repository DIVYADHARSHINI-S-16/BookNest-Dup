# Render Blueprint. Secrets are NOT stored here: values marked sync:false are
# entered in the Render dashboard.
services:
  - type: web
    name: booknest-server
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
