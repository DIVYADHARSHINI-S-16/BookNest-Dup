version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: booknest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: booknest_user
      POSTGRES_PASSWORD: booknest_pass
      POSTGRES_DB: booknest_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknest_user -d booknest_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: booknest_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    container_name: booknest_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://booknest_user:booknest_pass@postgres:5432/booknest_db
      REDIS_URL: redis://redis:6379
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 4000
      # Required: the server refuses to start without a strong secret (32+ chars).
      # Put JWT_SECRET=<long random string> in a .env file next to this file, or export it.
      # Generate one with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env or your shell before running docker compose}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "4000:4000"

volumes:
  postgres-data:
  redis-data:
